name: Mastodon Monitor

on:
  schedule:
    - cron: '0 */12 * * *'  # Ogni 12 ore
  workflow_dispatch:  # Puoi anche eseguirlo manualmente

jobs:
  monitor:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests schedule
      
      - name: Run monitor
        run: python main.py

      - name: Check if seen_posts.json exists and has content
        run: |
          if [ -f "seen_posts.json" ] && [ -s "seen_posts.json" ]; then
            echo "✅ seen_posts.json exists and has content"
            ls -lh seen_posts.json
          else
            echo "❌ ERROR: seen_posts.json is missing or empty!"
            exit 1
          fi

      - name: Commit seen_posts state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes
          if git diff --quiet seen_posts.json; then
            echo "ℹ️ No changes to seen_posts.json"
          else
            echo "📝 Changes detected, committing..."
            git add seen_posts.json
            git commit -m "Update seen posts state"
            git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
            echo "✅ State persisted successfully"
          fi
